<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="'Segoe UI', Helvetica, Arial, sans-serif">

  <!-- ================== STYLES ================== -->
  <defs>
    <style>
      .title       { font-size: 22px; font-weight: 700; fill: #1f2937; }
      .subtitle    { font-size: 12px; fill: #6b7280; font-style: italic; }
      .layer-label { font-size: 13px; font-weight: 700; fill: #b45309; letter-spacing: 0.15em; text-transform: uppercase; }
      .box-title   { font-size: 13px; font-weight: 700; fill: #111827; }
      .box-text    { font-size: 11px; fill: #374151; }
      .small       { font-size: 10px; fill: #6b7280; }
      .arrow-text  { font-size: 10px; fill: #4b5563; font-style: italic; }
      .table-name  { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .col         { font-size: 10px; fill: #1f2937; }
      .pk          { font-weight: 700; fill: #b45309; }
      .fk          { fill: #2563eb; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="880" fill="#fafaf7"/>

  <!-- ============= HEADER ============= -->
  <text x="40" y="40" class="title">Béhanzin — Histoire(s) Interactive · Architecture</text>
  <text x="40" y="60" class="subtitle">Laravel 12 · PHP 8.2 · Polling AJAX · Multi-joueurs synchrones</text>

  <!-- ============= COUCHE 1 : CLIENTS ============= -->
  <text x="40" y="100" class="layer-label">① Clients (navigateurs)</text>

  <!-- Joueur 1 -->
  <g>
    <rect x="40"  y="115" width="180" height="90" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="55"  y="135" class="box-title">🧑 Joueur · ganix</text>
    <text x="55"  y="155" class="box-text">Lit la scène, vote</text>
    <text x="55"  y="172" class="small">cookie session #A</text>
    <text x="55"  y="189" class="small">/jeu/REQUIN42</text>
  </g>

  <!-- Joueur 2 -->
  <g>
    <rect x="240" y="115" width="180" height="90" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="255" y="135" class="box-title">🧑 Joueur · delys</text>
    <text x="255" y="155" class="box-text">Lit la scène, vote</text>
    <text x="255" y="172" class="small">cookie session #B</text>
    <text x="255" y="189" class="small">/jeu/REQUIN42</text>
  </g>

  <!-- Joueur 3 -->
  <g>
    <rect x="440" y="115" width="180" height="90" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="455" y="135" class="box-title">🧑 Joueur · awa</text>
    <text x="455" y="155" class="box-text">Lit la scène, vote</text>
    <text x="455" y="172" class="small">cookie session #C</text>
    <text x="455" y="189" class="small">/jeu/REQUIN42</text>
  </g>

  <!-- MJ -->
  <g>
    <rect x="700" y="115" width="220" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="715" y="135" class="box-title">⚜ Maître de jeu</text>
    <text x="715" y="155" class="box-text">Supervise, force-advance, kick</text>
    <text x="715" y="172" class="small">/admin/session/REQUIN42/{token}</text>
    <text x="715" y="189" class="small">auto-refresh page (8 s)</text>
  </g>

  <!-- ============= COUCHE 2 : RÉSEAU ============= -->
  <text x="40" y="245" class="layer-label">② Réseau · HTTP / AJAX</text>

  <!-- Flèches montant des clients vers Routes -->
  <line x1="130" y1="205" x2="130" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="205" x2="330" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="205" x2="530" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="205" x2="810" y2="290" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <!-- Flèche AJAX (en pointillés bleus) -->
  <path d="M 145 205 Q 220 230 220 290" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="225" y="240" class="arrow-text" fill="#2563eb">AJAX poll · 5 s</text>
  <text x="225" y="255" class="small" fill="#2563eb">GET /jeu/{code}/check/{id}</text>
  <text x="225" y="268" class="small" fill="#2563eb">→ JSON {advanced, voted_count, ended}</text>

  <!-- Légende des routes -->
  <g>
    <rect x="950" y="115" width="270" height="155" rx="6" fill="#fafaf7" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="965" y="135" class="box-title">Routes principales</text>
    <text x="965" y="155" class="small">GET  /                       welcome</text>
    <text x="965" y="170" class="small">GET  /auth/rejoindre         join form</text>
    <text x="965" y="185" class="small">POST /auth/rejoindre         create player</text>
    <text x="965" y="200" class="small">GET  /jeu/{code}             scene</text>
    <text x="965" y="215" class="small">POST /jeu/{code}/vote/{id}   vote</text>
    <text x="965" y="230" class="small" fill="#2563eb">GET  /jeu/{code}/check/{id}  AJAX</text>
    <text x="965" y="245" class="small">GET  /jeu/{code}/resultats   results</text>
    <text x="965" y="260" class="small" fill="#b45309">/admin/session/{c}/{token}/* MJ</text>
  </g>

  <!-- ============= COUCHE 3 : SERVEUR LARAVEL ============= -->
  <text x="40" y="310" class="layer-label">③ Serveur · Laravel 12</text>

  <!-- Routes -->
  <g>
    <rect x="40"  y="325" width="160" height="80" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="55"  y="345" class="box-title">routes/web.php</text>
    <text x="55"  y="363" class="small">Route::prefix('jeu/{code}')</text>
    <text x="55"  y="377" class="small">Route::prefix('auth')</text>
    <text x="55"  y="391" class="small">Route::prefix('admin')</text>
  </g>

  <!-- Middleware -->
  <g>
    <rect x="220" y="325" width="160" height="80" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="235" y="345" class="box-title">Middleware</text>
    <text x="235" y="363" class="box-text">AuthPseudo</text>
    <text x="235" y="380" class="small">Vérifie player_id en session</text>
    <text x="235" y="394" class="small">→ redirect /auth/rejoindre</text>
  </g>

  <!-- AuthController -->
  <g>
    <rect x="400" y="325" width="180" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="415" y="345" class="box-title">AuthController</text>
    <text x="415" y="363" class="small">join()      crée le Player</text>
    <text x="415" y="377" class="small">login()     reconnecte</text>
    <text x="415" y="391" class="small">logout()    désactive</text>
  </g>

  <!-- GameController -->
  <g>
    <rect x="600" y="325" width="240" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="615" y="345" class="box-title">GameController</text>
    <text x="615" y="363" class="small">scene · vote · check (JSON) · results</text>
    <text x="615" y="377" class="small">createSession · storeSession</text>
    <text x="615" y="391" class="small" fill="#b45309">dashboard · dashboardAdvance · …</text>
  </g>

  <!-- Provider -->
  <g>
    <rect x="860" y="325" width="200" height="80" rx="6" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
    <text x="875" y="345" class="box-title">AppServiceProvider</text>
    <text x="875" y="363" class="small">Blade::if('auth_pseudo')</text>
    <text x="875" y="380" class="small">→ directive @auth_pseudo</text>
    <text x="875" y="394" class="small">utilisée dans le layout</text>
  </g>

  <!-- Vues Blade -->
  <g>
    <rect x="1080" y="325" width="140" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1095" y="345" class="box-title">Vues Blade</text>
    <text x="1095" y="361" class="small">layouts/app</text>
    <text x="1095" y="374" class="small">welcome · auth/*</text>
    <text x="1095" y="387" class="small">game/* · admin/*</text>
  </g>

  <!-- Flèches Routes → Middleware → Controllers -->
  <line x1="200" y1="365" x2="220" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="365" x2="400" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="380" x2="600" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="365" x2="860" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1060" y1="365" x2="1080" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============= COUCHE 4 : MODELS ============= -->
  <text x="40" y="440" class="layer-label">④ Eloquent · Logique métier</text>

  <g>
    <rect x="40"  y="455" width="180" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="55"  y="475" class="box-title">GameSession</text>
    <text x="55"  y="493" class="small">advanceToNextScene()</text>
    <text x="55"  y="507" class="small fk">↳ DB::transaction + lockForUpdate</text>
    <text x="55"  y="521" class="small">forceAdvance() · endNow()</text>
    <text x="55"  y="535" class="small">allPlayersVoted() · start()</text>
  </g>

  <g>
    <rect x="240" y="455" width="160" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="255" y="475" class="box-title">Player</text>
    <text x="255" y="493" class="small">hasVotedOnScene()</text>
    <text x="255" y="507" class="small">ping()  (last_seen_at)</text>
    <text x="255" y="521" class="small">getVoteForScene()</text>
  </g>

  <g>
    <rect x="420" y="455" width="160" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="435" y="475" class="box-title">Scene · Choice</text>
    <text x="435" y="493" class="small">scopeOrdered / NonEndings</text>
    <text x="435" y="507" class="small">choice.next_scene_id ⇒</text>
    <text x="435" y="521" class="small">bifurcation Acte III</text>
  </g>

  <g>
    <rect x="600" y="455" width="160" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="615" y="475" class="box-title">Vote</text>
    <text x="615" y="493" class="small">unique:</text>
    <text x="615" y="507" class="small fk">(player, session, scene)</text>
    <text x="615" y="521" class="small">→ anti double-vote BDD</text>
  </g>

  <!-- ============= COUCHE 5 : BDD ============= -->
  <text x="40" y="585" class="layer-label">⑤ Base de données · MySQL ou SQLite</text>

  <!-- Tables BDD -->
  <!-- scenes -->
  <g>
    <rect x="40"  y="600" width="170" height="135" rx="4" fill="#1f2937"/>
    <rect x="40"  y="600" width="170" height="22" rx="4" fill="#b45309"/>
    <text x="50"  y="616" class="table-name">scenes</text>
    <text x="50"  y="640" class="col"><tspan class="pk">id</tspan> · act · year</text>
    <text x="50"  y="656" class="col">title · content · quote</text>
    <text x="50"  y="672" class="col">question · sort_order</text>
    <text x="50"  y="688" class="col">is_ending</text>
    <text x="50"  y="704" class="col">ending_type</text>
    <text x="50"  y="720" class="small" fill="#9ca3af">[resistance/exile/sacrifice]</text>
  </g>

  <!-- choices -->
  <g>
    <rect x="240" y="600" width="170" height="135" rx="4" fill="#1f2937"/>
    <rect x="240" y="600" width="170" height="22" rx="4" fill="#b45309"/>
    <text x="250" y="616" class="table-name">choices</text>
    <text x="250" y="640" class="col"><tspan class="pk">id</tspan></text>
    <text x="250" y="656" class="col"><tspan class="fk">scene_id</tspan> →</text>
    <text x="250" y="672" class="col"><tspan class="fk">next_scene_id</tspan> →</text>
    <text x="250" y="688" class="col">text · sort_order</text>
    <text x="250" y="708" class="small" fill="#9ca3af">3 chemins en s7→s8a/b/c</text>
  </g>

  <!-- game_sessions -->
  <g>
    <rect x="440" y="600" width="180" height="135" rx="4" fill="#1f2937"/>
    <rect x="440" y="600" width="180" height="22" rx="4" fill="#b45309"/>
    <text x="450" y="616" class="table-name">game_sessions</text>
    <text x="450" y="640" class="col"><tspan class="pk">id</tspan> · code</text>
    <text x="450" y="656" class="col">master_name · master_token</text>
    <text x="450" y="672" class="col">max_players · status</text>
    <text x="450" y="688" class="col"><tspan class="fk">current_scene_id</tspan> →</text>
    <text x="450" y="704" class="col">ending_type · ending_text</text>
  </g>

  <!-- players -->
  <g>
    <rect x="650" y="600" width="170" height="135" rx="4" fill="#1f2937"/>
    <rect x="650" y="600" width="170" height="22" rx="4" fill="#b45309"/>
    <text x="660" y="616" class="table-name">players</text>
    <text x="660" y="640" class="col"><tspan class="pk">id</tspan></text>
    <text x="660" y="656" class="col"><tspan class="fk">game_session_id</tspan> →</text>
    <text x="660" y="672" class="col">pseudo</text>
    <text x="660" y="688" class="col">is_active</text>
    <text x="660" y="704" class="col">last_seen_at</text>
    <text x="660" y="724" class="small" fill="#9ca3af">unique(pseudo, session)</text>
  </g>

  <!-- votes -->
  <g>
    <rect x="850" y="600" width="180" height="135" rx="4" fill="#1f2937"/>
    <rect x="850" y="600" width="180" height="22" rx="4" fill="#b45309"/>
    <text x="860" y="616" class="table-name">votes</text>
    <text x="860" y="640" class="col"><tspan class="pk">id</tspan></text>
    <text x="860" y="656" class="col"><tspan class="fk">player_id</tspan> →</text>
    <text x="860" y="672" class="col"><tspan class="fk">game_session_id</tspan> →</text>
    <text x="860" y="688" class="col"><tspan class="fk">scene_id</tspan> →</text>
    <text x="860" y="704" class="col"><tspan class="fk">choice_id</tspan> →</text>
    <text x="860" y="724" class="small" fill="#9ca3af">unique(player, session, scene)</text>
  </g>

  <!-- Légende des FKs en bas -->
  <g>
    <rect x="1060" y="600" width="160" height="135" rx="4" fill="#fafaf7" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="1070" y="618" class="box-title">Sécurité concurrente</text>
    <text x="1070" y="638" class="small">▪ index unique sur votes</text>
    <text x="1070" y="654" class="small">▪ DB transaction</text>
    <text x="1070" y="670" class="small">▪ lockForUpdate</text>
    <text x="1070" y="686" class="small">▪ tie-breaker sur choice_id</text>
    <text x="1070" y="702" class="small">▪ token MJ Str::random(40)</text>
    <text x="1070" y="718" class="small">▪ CSRF Laravel partout</text>
  </g>

  <!-- ============= FLÈCHES MODELS ↔ TABLES ============= -->
  <line x1="130" y1="545" x2="130" y2="600" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="545" x2="320" y2="600" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="545" x2="500" y2="600" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="545" x2="680" y2="600" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="545" x2="940" y2="600" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ============= LÉGENDE FLUX VOTE (en bas) ============= -->
  <g>
    <rect x="40" y="770" width="1180" height="90" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="790" class="box-title">⚙ Flux d'un vote (cas critique : multi-joueurs synchrones)</text>
    <text x="55" y="810" class="box-text">
      ① POST /jeu/REQUIN42/vote/12   →   ② AuthPseudo   →   ③ GameController::vote   →   ④ INSERT votes (transaction, unique index = anti-doublon)
    </text>
    <text x="55" y="826" class="box-text">
      ⑤ session-&gt;refresh()   →   ⑥ allPlayersVoted ?   ⑦ advanceToNextScene() · lockForUpdate · re-check sous verrou · majorité
    </text>
    <text x="55" y="844" class="box-text">
      ⑧ UPDATE game_sessions.current_scene_id   →   ⑨ tous les joueurs voient leur AJAX poll renvoyer {advanced:true, next_url} · redirect navigateur
    </text>
  </g>

</svg>
